name: Diagnostico
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0"
          for u in "https://datos.produccion.gob.ar/api/3/action/package_show?id=sepa-precios" \
                   "https://datos.produccion.gob.ar/dataset/sepa-precios" \
                   "https://www.preciosclaros.gob.ar/" \
                   "https://d3e6htiiul5ek9.cloudfront.net/prod/sucursales?lat=-42.7692&lng=-65.0385&limit=50" \
                   "https://www.argentina.gob.ar/"; do
            echo "== $u"; curl -sS -m 30 -A "$UA" -o /tmp/r -w "HTTP %{http_code}\n" "$u"; head -c 600 /tmp/r; echo
          done
          curl -sS -m 10 https://ipinfo.io/country || true
