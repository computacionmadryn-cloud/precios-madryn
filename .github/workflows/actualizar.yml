name: Actualizar precios

# El portal de datos del Gobierno bloquea las conexiones desde fuera de Argentina,
# y los servidores de GitHub están en EE.UU. Por eso la actualización diaria corre
# en una PC en Argentina con actualizar.bat. Este workflow queda solo para correrlo
# a mano, por si algún día el portal abre el acceso.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar SEPA y generar data/precios.json
        run: python actualizar_precios.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/precios.json
          git diff --cached --quiet || git commit -m "Precios actualizados $(date -u +%F)"
          git push
